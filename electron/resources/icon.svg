<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8a3d"/>
      <stop offset="100%" stop-color="#f6403f"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5a52"/>
      <stop offset="100%" stop-color="#f6403f"/>
    </linearGradient>
  </defs>
  <!-- Red rounded square background -->
  <rect width="64" height="64" rx="14" fill="url(#redGrad)"/>
  <!-- Black camera body -->
  <rect x="10" y="14" width="36" height="28" rx="7" fill="#0a0a0f" />
  <!-- Camera viewfinder right protrusion -->
  <path d="M46 20 L56 16 Q58 15 58 18 L58 38 Q58 41 56 40 L46 36 Z" fill="#0a0a0f"/>
  <!-- Orange play triangle -->
  <path d="M22 22 L38 30 Q40 31 38 33 L22 42 Q20 43.5 20 41 L20 24 Q20 20.5 22 22 Z" fill="url(#playGrad)"/>
  <!-- White dashed cut line -->
  <line x1="32" y1="12" x2="32" y2="42" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="3 3" opacity="0.95"/>
  <!-- Scissors - bottom left -->
  <g transform="translate(14,38) rotate(-45)">
    <!-- Scissors handles - two loops -->
    <ellipse cx="-3" cy="8" rx="4.5" ry="4.5" fill="white" stroke="#0a0a0f" stroke-width="0.6"/>
    <ellipse cx="7" cy="8" rx="4.5" ry="4.5" fill="white" stroke="#0a0a0f" stroke-width="0.6"/>
    <circle cx="-3" cy="8" r="2" fill="#f0f0f0"/>
    <circle cx="7" cy="8" r="2" fill="#f0f0f0"/>
    <!-- Scissors blades -->
    <path d="M2 0 L12 -7 L11 -9 L1 -2 Z" fill="white" stroke="#0a0a0f" stroke-width="0.5" stroke-linejoin="round"/>
    <path d="M2 0 L12 7 L11 9 L1 2 Z" fill="white" stroke="#0a0a0f" stroke-width="0.5" stroke-linejoin="round"/>
    <!-- Pivot -->
    <circle cx="2" cy="0" r="1.3" fill="#0a0a0f"/>
  </g>
</svg>
