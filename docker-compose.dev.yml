# Local development: Postgres only.
#
# Usage:
#   docker compose -f docker-compose.dev.yml up -d
#
# Backend and web run directly on the host (poetry / npm).
# After the first start, create the schema (from backend/):
#   poetry run alembic upgrade head
#
# Default local dev DB: postgresql://clipforge:clipforge@localhost:5438/clipforge

services:
  postgres:
    image: postgres:16-alpine
    container_name: clipforge-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: clipforge
      POSTGRES_PASSWORD: clipforge
      POSTGRES_DB: clipforge
    ports:
      - "5438:5432"
    volumes:
      - clipforge_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clipforge"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  clipforge_pgdata:
