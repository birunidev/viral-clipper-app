name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
        include:
          - os: ubuntu-latest
            args: --linux
          - os: windows-latest
            args: --win
          - os: macos-14
            args: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            electron/package.json
            electron/renderer/package.json
      - name: Install renderer deps
        run: npm ci
        working-directory: electron/renderer
      - name: Build renderer
        run: npm run build
        working-directory: electron/renderer
      - name: Install electron deps
        run: npm ci
        working-directory: electron
      - name: Install build deps (whisper.cpp)
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            sudo apt-get update && sudo apt-get install -y cmake build-essential git curl
            cmake --version; gcc --version
          elif [[ "${{ matrix.os }}" == "macos-14" ]]; then
            brew list cmake >/dev/null 2>&1 || brew install cmake
            cmake --version; clang --version
          else
            echo "Windows — whisper prebuilt will be downloaded, no cmake needed"
            cmake --version || echo "cmake not found on Windows (expected)"
          fi
      - name: Compile TypeScript
        run: npx tsc
        working-directory: electron
      - name: Prepare binaries (whisper + ffmpeg)
        run: node scripts/prepare-build.mjs --skip-models
        working-directory: electron
      - name: Verify deps (binaries only, models are lazy-downloaded to ~/.config/clipzard-desktop / ~/.clipzard)
        run: node -e "import('./dist/services/deps.js').then(m=>{console.log(JSON.stringify(m.getDepsStatus(),null,2)); const miss=m.missingDeps().filter(d=>!d.key.includes('model')).map(d=>d.key); if(miss.length){console.error('MISSING required binaries:',miss);process.exit(1)}})"
        working-directory: electron
      - name: Build app
        run: npx electron-builder ${{ matrix.args }} --publish never
        working-directory: electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      - name: Publish update (CLIPZARD_API_KEY)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME#v}"
          # map matrix.os -> platform/arch
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then PLATFORM=win32; ARCH=x64; FILE=$(ls electron/release/*.exe 2>/dev/null | head -n1 || true)
          elif [[ "${{ matrix.os }}" == "macos-14" ]]; then PLATFORM=darwin; ARCH=arm64; FILE=$(ls electron/release/*.dmg 2>/dev/null | ls electron/release/*.zip 2>/dev/null | head -n1 || true); FILE=${FILE:-$(ls electron/release/*.dmg 2>/dev/null | head -n1)}
          else PLATFORM=linux; ARCH=x64; FILE=$(ls electron/release/*.AppImage 2>/dev/null | head -n1 || true)
          fi
          if [[ -z "$FILE" || ! -f "$FILE" ]]; then echo "No artifact found for $PLATFORM/$ARCH"; ls -l electron/release/ || true; exit 1; fi
          IS_BETA="false"; if [[ "$VERSION" == *"-"* ]]; then IS_BETA="true"; fi
          API="${CLIPZARD_API_URL:-https://clipzard.web.id}"
          echo "Uploading $FILE as $PLATFORM/$ARCH $VERSION beta=$IS_BETA to $API"
          node ../scripts/upload-release.mjs --file="$FILE" --version="$VERSION" --platform="$PLATFORM" --arch="$ARCH" --channel="$([ "$IS_BETA" = "true" ] && echo beta || echo stable)" --api="$API"
        working-directory: electron
        env:
          CLIPZARD_API_KEY: ${{ secrets.CLIPZARD_API_KEY }}
          CLIPZARD_API_URL: ${{ secrets.CLIPZARD_API_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: clipzard-${{ matrix.os }}
          path: |
            electron/release/*.AppImage
            electron/release/*.deb
            electron/release/*.exe
            electron/release/*.dmg
            electron/release/*.zip
