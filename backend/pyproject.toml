[tool.poetry]
name = "clipzard-backend"
version = "0.1.0"
description = "Viral clipping engine (FastAPI job service)"
authors = ["birunidev"]
readme = "README.md"
packages = [{ include = "core" }, { include = "app" }]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.115.0"
uvicorn = "^0.30.0"
psycopg = { version = "^3.2.0", extras = ["binary"] }
openai = "^1.30.0"
requests = "^2.31.0"
boto3 = "^1.34.0"
python-dotenv = "^1.2.2"
yt-dlp = "^2026.7.4"
bgutil-ytdlp-pot-provider = "^1.2.0"
google-api-python-client = "^2.0.0"
google-auth = "^2.0.0"
sqlalchemy = "^2.0.0"
alembic = "^1.13.0"
cryptography = "^50.0.0"
pydantic = { version = "^2.0.0", extras = ["email"] }
argon2-cffi = "^23.1.0"
pywhispercpp = { version = "^1.3.0", optional = true }

[tool.poetry.extras]
# Local-model deployments (TRANSCRIPTION_PROVIDER=local): whisper.cpp
# bindings with Metal (Apple Silicon) / CUDA / CPU backends selected
# automatically at install time. Not needed for cloud-only (AssemblyAI)
# deployments, so it's kept optional to avoid the native build step there.
local = ["pywhispercpp"]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
