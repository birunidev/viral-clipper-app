[project]
name = "clipzard-backend"
version = "0.1.0"
description = "Viral clipping engine (FastAPI job service)"
readme = "README.md"
authors = [{ name = "birunidev" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary]>=3.2",
    "openai>=1.30",
    "requests>=2.31",
    "boto3>=1.34",
    "python-dotenv>=1.2",
    "yt-dlp>=2026.7.4",
    "bgutil-ytdlp-pot-provider>=1.2.0",
    "google-api-python-client>=2.0",
    "google-auth>=2.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "cryptography>=50.0",
    "pydantic[email]>=2.0",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
local = ["pywhispercpp>=1.3"]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.poetry]
packages = [{ include = "core" }, { include = "app" }]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
