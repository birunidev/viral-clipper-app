appId: com.clipforge.desktop
productName: ClipForge
directories:
  output: release
  buildResources: resources
files:
  - dist/**/*
  - renderer/dist/**/*
  - ../web/out/**/*
  - resources/**/*
  - package.json
extraResources:
  - from: resources/bin
    to: bin
    filter: ["**/*"]
# Models (whisper GGML + Qwen GGUF) are NOT bundled by default to keep installer small (~150MB vs +8GB).
# They are lazily downloaded on first transcribe/analyze to userData/models/ (see src/services/transcriber.ts:39, analyzer.ts:147).
# To pre-seed for offline installer, run `npm run models:download -- --out=resources/models` and uncomment:
#  - from: resources/models
#    to: models
#    filter: ["**/*"]
win:
  target: nsis
  icon: resources/icon.ico
  verifyUpdateCodeSignature: false
  signingHashAlgorithms: ["sha256"]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  perMachine: false
mac:
  target:
    - dmg
    - zip
  icon: resources/icon.png
  category: public.app-category.video
  hardenedRuntime: false
  gatekeeperAssess: false
  entitlements: null
  entitlementsInherit: null
dmg:
  sign: false
linux:
  target:
    - AppImage
    - deb
  icon: resources/icon.png
  category: Video
  maintainer: ClipForge <hello@clipforge.com>
  description: ClipForge Desktop - fully local viral clip engine
publish:
  provider: github
  owner: clipforge
  repo: clipforge
  private: false
