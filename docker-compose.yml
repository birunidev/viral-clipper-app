services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    expose:
      - "8000"

  web:
    build: ./web
    restart: unless-stopped
    env_file: ./web/.env
    depends_on:
      - backend
    expose:
      - "3000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  caddy_data:
  caddy_config:
