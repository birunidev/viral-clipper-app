[tool.poetry]
name = "clipforge"
version = "0.1.0"
description = "Desktop app that finds viral moments in long videos and cuts vertical clips"
authors = ["birunidev"]
readme = "README.md"
packages = [{ include = "core" }, { include = "ui" }]

[tool.poetry.dependencies]
python = "^3.10"
customtkinter = "^5.2.2"
openai = "^1.30.0"
requests = "^2.31.0"
boto3 = "^1.34.0"
python-dotenv = "^1.2.2"
yt-dlp = "^2026.7.4"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
