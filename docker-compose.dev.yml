# Local development: Postgres (dev + test).
#
# Usage:
#   docker compose -f docker-compose.dev.yml up -d
#
# Backend and web run directly on the host (poetry / npm).
# After the first start, create the schema (from backend/):
#   poetry run alembic upgrade head
#
# Dev DB:   postgresql://clipzard:clipzard@localhost:5438/clipzard
# Test DB:  postgresql://clipzard:clipzard@localhost:5439/clipzard_test

services:
  postgres:
    image: postgres:16-alpine
    container_name: clipzard-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: clipzard
      POSTGRES_PASSWORD: clipzard
      POSTGRES_DB: clipzard
    ports:
      - "5438:5432"
    volumes:
      - clipzard_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clipzard"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Isolated database for the pytest suite (tests/conftest.py). Wiped and
  # recreated by every test run — never point the app itself at this one.
  postgres-test:
    image: postgres:16-alpine
    container_name: clipzard-dev-db-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: clipzard
      POSTGRES_PASSWORD: clipzard
      POSTGRES_DB: clipzard_test
    ports:
      - "5439:5432"
    volumes:
      - clipzard_pgdata_test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clipzard"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  clipzard_pgdata:
  clipzard_pgdata_test:
