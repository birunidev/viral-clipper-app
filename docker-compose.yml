# Production deployment.
#
# Topology: Caddy runs on the HOST (not in Docker) and proxies to
# web/backend published on loopback only (127.0.0.1) — unreachable from
# the public internet directly. Postgres has NO published ports at all
# and is reachable only from backend on the internal compose network.
#
# Required in .env (project root):
#   POSTGRES_PASSWORD   # strong password — compose refuses to start without it
# Optional:
#   POSTGRES_USER (default clipforge), POSTGRES_DB (default clipforge)
#   FRONTEND_URLS, NEXT_PUBLIC_API_URL

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clipforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-clipforge}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Hardening: no privilege escalation, no kernel capabilities, no ports
    # published — the DB is reachable only from backend on the internal net.
    # The official image's entrypoint chowns/chmods its dirs and drops from
    # root to the `postgres` user, so it keeps exactly the five capabilities
    # that requires (everything else stays dropped).
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN # take ownership of the data dir at initdb
      - DAC_OVERRIDE # read/write the data dir regardless of mode bits
      - FOWNER # chmod/chown files it owns
      - SETGID # switch root -> postgres group
      - SETUID # switch root -> postgres user
    deploy:
      resources:
        limits:
          memory: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # PO token provider sidecar (bgutil-ytdlp-pot-provider)
  # Self-hosted JS challenge solver for YouTube's Proof-of-Origin tokens.
  # Partial mitigation: improves format availability more than outright bot-blocks.
  # See https://github.com/Brainicism/bgutil-ytdlp-pot-provider
  pot:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    restart: unless-stopped
    init: true
    # No ports published – backend reaches it on internal network at http://pot:4416
    expose:
      - "4416"
    environment:
      # Optional: set a custom port inside container (default 4416)
      PORT: "4416"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:4416/ping',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\" || node -e \"require('http').get('http://127.0.0.1:4416/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Hardened: no privileges, read-only-ish
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 512m
          pids: 128

  backend:
    build: ./backend
    restart: unless-stopped
    init: true
    env_file: ./backend/.env
    environment:
      # CORS allow-list for the browser app. With the host Caddy proxying
      # /api/* on the same domain as the web app this is same-origin, but
      # FastAPI still needs an explicit allowed origin (cookies + Origin).
      FRONTEND_URLS: ${FRONTEND_URLS:-https://example.com}
      # Always talk to the internal postgres, never whatever localhost/dev
      # URL happens to be in backend/.env (compose overrides env_file).
      DATABASE_URL: postgresql://${POSTGRES_USER:-clipforge}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-clipforge}
      # PO token sidecar (bgutil). Backend's yt-dlp plugin contacts this to fetch
      # Proof-of-Origin tokens. Disabled by default (empty = no POT); set to
      # http://pot:4416 to enable. Can also be overridden in backend/.env via
      # POT_PROVIDER_URL / BGUTIL_URL.
      POT_PROVIDER_URL: ${POT_PROVIDER_URL:-http://pot:4416}
      # YouTube: safe prod uses YOUTUBE_API_KEY + ENABLE_YTDLP=0 (no cookies).
      # Legacy yt-dlp vars (YTDLP_COOKIEFILE etc.) are read from backend/.env
      # via env_file above – do not duplicate here (would mask env_file).
      # See backend/.env.example for docs.
    # Loopback-only publication: the host Caddy reaches it at 127.0.0.1:8000;
    # the public internet cannot.
    ports:
      - "127.0.0.1:8000:8000"
    # Local transcription (TRANSCRIPTION_PROVIDER=local): whisper.cpp models
    # (~150MB-1.5GB) download on first use into this path — persist them so
    # container recreation doesn't re-download.
    volumes:
      - whisper_models:/root/.local/share/pywhispercpp/models
      # Legacy yt-dlp cookies – only needed if ENABLE_YTDLP=1 (unsafe, dev only).
      # For safe prod (ENABLE_YTDLP=0) this mount is ignored. If you must use
      # legacy mode, place cookies at ./cookies.txt and set YTDLP_COOKIEFILE=/app/cookies.txt.
      # Note: /tmp is tmpfs, so do not mount cookies there.
      - ./cookies.txt:/app/cookies.txt
    depends_on:
      postgres:
        condition: service_healthy
      pot:
        condition: service_started
    # ffmpeg + transcriber stage scratch files in /tmp; give them RAM-backed
    # space so a runaway render can't fill the disk.
    tmpfs:
      - /tmp:size=1g,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE # allow read/write cookies.txt regardless of host uid/gid (placeholder is 1000:1001)
    deploy:
      resources:
        limits:
          memory: 4g
          pids: 512
    healthcheck:
      test: [
          "CMD",
          "python",
          "-c",
          # /health is the unauthenticated liveness endpoint (200). Never
          # probe auth'd endpoints: a correct 401 reads as failure.
          "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  web:
    build:
      context: ./web
      args:
        # Browser-facing API origin. With the host Caddy proxying /api/* on
        # the same domain as the web app, this can be a same-origin path.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://snapclip.mysaas.web.id/api/v1}
        # GA4 measurement id (empty = analytics disabled).
        NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
    restart: unless-stopped
    init: true
    # Loopback-only publication: host Caddy reaches web at 127.0.0.1:3005
    # (host 3000 runs another service on this VPS). Container and host both
    # use 3005 — same number inside and out, no translation to reason about.
    ports:
      - "127.0.0.1:3005:3005"
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 1g
          pids: 256
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3005/').then(r=>process.exit(0)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
  whisper_models:
