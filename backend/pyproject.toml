[tool.poetry]
name = "clipforge-backend"
version = "0.1.0"
description = "Viral clipping engine (FastAPI job service)"
authors = ["birunidev"]
readme = "README.md"
packages = [{ include = "core" }, { include = "app" }]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.115.0"
uvicorn = "^0.30.0"
psycopg = { version = "^3.2.0", extras = ["binary"] }
openai = "^1.30.0"
requests = "^2.31.0"
boto3 = "^1.34.0"
python-dotenv = "^1.2.2"
yt-dlp = "^2026.7.4"

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
